[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dockpilot"
version = "1.2"
description = "See and manage your laptop docking station — Ubuntu-native (GTK 4 / libadwaita)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "OpenDock", email = "hello@opendocktech.com" }]
license = "MIT"
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/dinnerisserved/dockpilot"

[project.scripts]
dockpilot = "dockpilot_pkg.__main__:main"
dockpilotd = "dockpilot_pkg.__main__:daemon"
opendock = "dockpilot_pkg.__main__:cli"

[project.optional-dependencies]
opendock = ["pyserial"]

[tool.setuptools]
packages = ["dockpilot_pkg"]
package-dir = { "" = "pip_build" }
include-package-data = true

[tool.setuptools.package-data]
dockpilot_pkg = ["*.py", "packaging/*", "packaging/gnome-extension/*"]
